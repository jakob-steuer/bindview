 <g class="footnotes">
  <text x="18" y="355.87" font-size="10.5" fill="#667085">Stroke weight and opacity follow the model's pLDDT: a contact is drawn at the lower of its two ends'</text>
  <text x="18" y="371.1" font-size="10.5" fill="#667085">values, a residue at its own. ? marks pLDDT below 50.</text>
  <text x="18" y="386.32" font-size="10.5" fill="#667085">An interface has no centre. The residues of the N-terminal domain that touch the C-terminal domain</text>
  <text x="18" y="401.55" font-size="10.5" fill="#667085">stand in a column, as boxes, in the order of the sequence; a dotted line stands for residues in between</text>
  <text x="18" y="416.77" font-size="10.5" fill="#667085">that do not; those of the C-terminal domain around it. A line is a pair of residues, at the shortest of its</text>
  <text x="18" y="432" font-size="10.5" fill="#667085">contacts of one kind.</text>
  <text x="18" y="447.22" font-size="10.5" fill="#667085">All 2 residues of the N-terminal domain at the interface are shown, with 5 contacts.</text>
  <text x="18" y="462.45" font-size="10.5" fill="#667085">PAE (predicted aligned error) is the model's expected error, in ångström, in placing one residue of a</text>
  <text x="18" y="477.67" font-size="10.5" fill="#667085">contact relative to the other: low is confident, about 32 means no idea. It is not pLDDT, which line weight,</text>
  <text x="18" y="492.9" font-size="10.5" fill="#667085">dashes and ? show.</text>
  <text x="18" y="508.12" font-size="10.5" fill="#667085">All 4 residue pairs in contact have a PAE of 5 Å or more, written on their lines.</text>
 </g>
